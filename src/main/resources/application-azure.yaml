spring:
  config:
    activate:
      on-profile: azure
  datasource:
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      minimum-idle: ${DB_MINIMUM_IDLE:0}
      # Non blocca l'avvio del container mentre Azure SQL è in pausa.
      initialization-fail-timeout: ${DB_INITIALIZATION_FAIL_TIMEOUT_MS:-1}
      # Azure SQL serverless restituisce 40613 durante la riattivazione. Una
      # attesa breve permette alla API di rispondere 503 e al frontend di
      # riprovare automaticamente, senza lasciare la schermata ferma per 95 s.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      data-source-properties:
        loginTimeout: ${DB_LOGIN_TIMEOUT_SECONDS:10}
        connectRetryCount: ${DB_CONNECT_RETRY_COUNT:1}
        connectRetryInterval: ${DB_CONNECT_RETRY_INTERVAL_SECONDS:5}
  jpa:
    hibernate:
      # Il progetto dimostrativo crea e aggiorna lo schema al primo avvio.
      # In produzione sostituire con migrazioni versionate e "validate".
      ddl-auto: update

server:
  forward-headers-strategy: framework
  shutdown: graceful

reporting:
  datasource:
    connection-timeout-ms: ${REPORTING_DB_CONNECTION_TIMEOUT_MS:10000}
    login-timeout-seconds: ${DB_LOGIN_TIMEOUT_SECONDS:10}
    connect-retry-count: ${DB_CONNECT_RETRY_COUNT:1}
    connect-retry-interval-seconds: ${DB_CONNECT_RETRY_INTERVAL_SECONDS:5}

assistente:
  database:
    connection-timeout-ms: ${AI_DB_CONNECTION_TIMEOUT_MS:10000}
    login-timeout-seconds: ${DB_LOGIN_TIMEOUT_SECONDS:10}
    connect-retry-count: ${DB_CONNECT_RETRY_COUNT:1}
    connect-retry-interval-seconds: ${DB_CONNECT_RETRY_INTERVAL_SECONDS:5}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
