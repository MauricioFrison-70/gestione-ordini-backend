spring:
  config:
    activate:
      on-profile: azure
  datasource:
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      minimum-idle: ${DB_MINIMUM_IDLE:0}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      # Il progetto dimostrativo crea e aggiorna lo schema al primo avvio.
      # In produzione sostituire con migrazioni versionate e "validate".
      ddl-auto: update

server:
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
