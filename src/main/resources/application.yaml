spring:
  application:
    name: demo

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=ProjectJava;encrypt=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

  jackson:
    deserialization:
      accept-float-as-int: false

notifiche:
  scorta:
    destinatario: ${EMAIL_RESPONSABILE_SCORTA:}
    mittente: ${GMAIL_SENDER_EMAIL:}

gmail:
  oauth:
    client-id: ${GMAIL_OAUTH_CLIENT_ID:}
    client-secret: ${GMAIL_OAUTH_CLIENT_SECRET:}
    refresh-token: ${GMAIL_OAUTH_REFRESH_TOKEN:}
    redirect-uri: ${GMAIL_OAUTH_REDIRECT_URI:http://localhost:8081/login/oauth2/code/google}
    authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    api-base-uri: https://gmail.googleapis.com/gmail/v1/
    setup-enabled: ${GMAIL_OAUTH_SETUP_ENABLED:false}

server:
  port: 8081

reporting:
  datasource:
    url: ${REPORTING_DB_URL:${spring.datasource.url}}
    username: ${REPORTING_DB_USERNAME:${DB_USERNAME}}
    password: ${REPORTING_DB_PASSWORD:${DB_PASSWORD}}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    maximum-pool-size: ${REPORTING_DB_MAX_POOL_SIZE:3}
    connection-timeout-ms: ${REPORTING_DB_CONNECTION_TIMEOUT_MS:10000}
  execution:
    maximum-rows: ${REPORTING_MAX_ROWS:1000}
    query-timeout-seconds: ${REPORTING_QUERY_TIMEOUT_SECONDS:30}
